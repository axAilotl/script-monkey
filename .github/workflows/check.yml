name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Exercise sidebar onboarding and generation
        run: |
          node --input-type=module - <<'JS'
          import { chromium } from 'playwright';
          process.env.SCRIPT_MONKEY_CHROMIUM = chromium.executablePath();
          await import('./tests/browser/sidebar.mjs');
          JS
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: script-monkey
          path: artifacts/script-monkey-*.zip
